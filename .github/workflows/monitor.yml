name: Website Monitor

on:
  schedule:
    # 22:00 UTC daily = 08:00 AEST / 09:00 AEDT — start of the Australian business day.
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run website health checks
        run: node scripts/monitor.mjs
